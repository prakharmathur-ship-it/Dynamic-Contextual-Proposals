/* =====================================================================
 * ACCEPTANCE TESTS – run against the real engines + proposal service on a
 * sandbox state (the live prototype state is not touched).
 * ===================================================================== */
window.UC = window.UC || {};

UC.Tests = (function () {
  function synth(cfg, metrics, current) {
    const s = UC.DATA.getScenarioSeller('1.1');
    Object.assign(s.metrics, metrics);
    if (current) s.currentService = current;
    return s;
  }

  function run(cfg) {
    const R = UC.RecommendationEngine, M = UC.McatEngine, S = UC.ProposalService, P = UC.PricingEngine;
    const out = [];
    const t = (id, name, expected, fn) => {
      try { const r = fn(); out.push({ id, name, expected, actual: r.actual, pass: !!r.pass }); }
      catch (err) { out.push({ id, name, expected, actual: 'Error: ' + err.message, pass: false }); }
    };
    const base = { blDau: 45, pnsSuccess: 78, totalARank: 8, optedARank: 5, preferredDistricts: 10 };
    const svcOf = r => r.journey === 'SERVICING' ? 'Focus on Servicing' : cfg.services[r.serviceKey].name;

    t('T1', 'Seller with BL DAU below 20', 'Focus on Servicing', () => { const r = R.evaluate(synth(cfg, Object.assign({}, base, { blDau: 19 })), cfg); return { actual: svcOf(r), pass: r.journey === 'SERVICING' }; });
    t('T2', 'Seller with PNS ≤60% (boundary 60)', 'Focus on Servicing', () => { const r = R.evaluate(synth(cfg, Object.assign({}, base, { pnsSuccess: 60 })), cfg); return { actual: svcOf(r), pass: r.journey === 'SERVICING' }; });
    t('T3', 'Seller with Total A Rank = 0', 'Focus on Servicing', () => { const r = R.evaluate(synth(cfg, Object.assign({}, base, { totalARank: 0 })), cfg); return { actual: svcOf(r), pass: r.journey === 'SERVICING' }; });
    t('T4', 'Checks cleared, >3 opted, districts <15 (5, 14)', 'IM Star Pro', () => { const r = R.evaluate(synth(cfg, Object.assign({}, base, { optedARank: 5, preferredDistricts: 14 })), cfg); return { actual: svcOf(r) + ' (' + r.ruleId + ')', pass: r.serviceKey === 'IM_STAR_PRO' }; });
    t('T5', 'Checks cleared, >3 opted, districts ≥15 (4, 15)', 'Preferred Star Pro', () => { const r = R.evaluate(synth(cfg, Object.assign({}, base, { optedARank: 4, preferredDistricts: 15 })), cfg); return { actual: svcOf(r) + ' (' + r.ruleId + ')', pass: r.serviceKey === 'PREFERRED_STAR_PRO' }; });
    t('T6', 'Checks cleared, ≤3 opted, districts <30 (3, 29)', 'IM Star Pro', () => { const r = R.evaluate(synth(cfg, Object.assign({}, base, { optedARank: 3, preferredDistricts: 29 })), cfg); return { actual: svcOf(r) + ' (' + r.ruleId + ')', pass: r.serviceKey === 'IM_STAR_PRO' }; });
    t('T7', 'Checks cleared, ≤3 opted, districts ≥30 (3, 30)', 'Preferred Star Pro', () => { const r = R.evaluate(synth(cfg, Object.assign({}, base, { optedARank: 3, preferredDistricts: 30 })), cfg); return { actual: svcOf(r) + ' (' + r.ruleId + ')', pass: r.serviceKey === 'PREFERRED_STAR_PRO' }; });
    t('T8', 'India Star 1Y + servicing', 'India Star MYR proposal', () => { const r = R.evaluate(UC.DATA.getScenarioSeller('2.1'), cfg); return { actual: r.proposalAllowed ? `${cfg.services[r.serviceKey].name} ${r.tenure} proposal` : 'No proposal', pass: r.proposalAllowed && r.serviceKey === 'INDIA_STAR' && r.tenure === 'MYR' }; });
    t('T9', 'India Star MYR + servicing', 'No automatic MYR proposal', () => {
      const st = S.newState(), s = UC.DATA.getScenarioSeller('2.2');
      const p = S.revealRecommended(st, cfg, s);
      return { actual: p ? 'Proposal ' + p.final.serviceKey + ' ' + p.final.tenure : 'No proposal generated', pass: p === null };
    });
    t('T10', 'Fewer than target MCATs qualify (scenario 5.2)', 'Proposal with available MCATs', () => {
      const st = S.newState(), s = UC.DATA.getScenarioSeller('5.2');
      const p = S.revealRecommended(st, cfg, s);
      const n = p.final.lines.length;
      return { actual: `${n} of 3 MCATs · proposal ${p ? 'generated' : 'missing'}`, pass: !!p && n > 0 && n < 3 };
    });
    t('T11', 'A-rank MCATs insufficient (scenario 1.2)', 'B-rank fallback used', () => {
      const r = M.evaluate(UC.DATA.getScenarioSeller('1.2'), 'IM_STAR_PRO', cfg);
      return { actual: r.selected.map(x => x.name + ' (' + x.rank + ')').join(', '), pass: r.selected.some(x => x.rank === 'B') && r.selected.some(x => x.rank === 'A') };
    });
    t('T11b', 'No MCAT qualifies (scenario 1.3)', 'MCAT recommendation held', () => {
      const st = S.newState(), s = UC.DATA.getScenarioSeller('1.3');
      const p = S.revealRecommended(st, cfg, s);
      const errs = S.validate(cfg, p.final);
      return { actual: `${p.final.lines.length} MCATs · status ${p.final.mcatStatus} · send blocked: ${errs.length > 0}`, pass: p.final.lines.length === 0 && p.final.mcatStatus === 'HELD' && errs.length > 0 };
    });
    t('T12', 'Executive changes service ISP → PSP', 'Proposal + email updated, original kept', () => {
      const st = S.newState(), s = UC.DATA.getScenarioSeller('1.1');
      const p = S.revealRecommended(st, cfg, s);
      const before = UC.EmailTemplates.build(p, s, cfg);
      const f = UC.Util.clone(p.final); S.applyService(f, s, cfg, 'PREFERRED_STAR_PRO');
      S.saveFinal(st, cfg, s, p.id, f);
      const after = UC.EmailTemplates.build(p, s, cfg);
      const tr = st.tracking[p.id];
      return { actual: `${before.scenario} → ${after.scenario}; original ${tr.originalRecommendedService}; final ${tr.finalSelectedService}; overridden ${tr.serviceOverridden}`,
        pass: before.scenario === 'UPSELL_ISP' && after.scenario === 'UPSELL_PSP' && p.recommendation.serviceKey === 'IM_STAR_PRO' && tr.serviceOverridden };
    });
    t('T13', 'Executive edits commercial value', 'Final amount updated', () => {
      const st = S.newState(), s = UC.DATA.getScenarioSeller('1.1');
      const p = S.revealRecommended(st, cfg, s);
      const a0 = P.totals(cfg, p.final).amountInclGst;
      const f = UC.Util.clone(p.final); f.lines[0].deal = 50000; f.discount = { on: true, mode: 'pct', pct: 10, amt: 0, offerId: null };
      S.saveFinal(st, cfg, s, p.id, f);
      const tt = P.totals(cfg, p.final);
      const expectNet = Math.round((50000 + f.lines.slice(1).reduce((a, l) => a + l.deal, 0)) * 0.9);
      return { actual: `${UC.Util.inr(a0)} → ${UC.Util.inr(tt.amountInclGst)} (net ${UC.Util.inr(tt.netDeal)})`, pass: tt.netDeal === expectNet && tt.amountInclGst !== a0 };
    });
    t('T14', 'Executive sends proposal', 'Reference no. + history updated', () => {
      const st = S.newState(), s = UC.DATA.getScenarioSeller('5.1');
      const p = S.revealRecommended(st, cfg, s);
      const r = S.sendProposal(st, cfg, s, p.id);
      const inHist = S.workspace(st, '5.1').proposals.filter(x => x.status !== 'Draft');
      return { actual: `${r.ok ? 'Sent' : 'Failed'} · ref ${p.refNo} · history ${inHist.length} (existing 4 kept)`, pass: r.ok && /^UCP-/.test(p.refNo) && p.status === 'Sent' && inHist.length === 5 };
    });
    t('T15', 'Executive views sent proposal', 'Generated email displayed', () => {
      const st = S.newState(), s = UC.DATA.getScenarioSeller('2.1');
      const p = S.revealRecommended(st, cfg, s);
      S.sendProposal(st, cfg, s, p.id);
      return { actual: `${p.email.scenario} · "${p.email.subject.slice(0, 50)}…"`, pass: p.email.html.includes(s.name.split(' ')[0]) || p.email.html.includes(s.contactName) };
    });
    t('C1', 'Upsell rules mutually exclusive (grid 0–10 opted × 0–60 districts)', 'Exactly one rule per combination', () => {
      let bad = 0;
      for (let o = 0; o <= 10; o++) for (let d = 0; d <= 60; d++) {
        const n = cfg.upsellRules.filter(r => Object.keys(r.when).every(k => UC.Util.compare(k === 'optedARank' ? o : d, r.when[k]))).length;
        if (n !== 1) bad++;
      }
      return { actual: bad ? bad + ' combinations overlap or have no rule' : 'All 671 combinations → 1 rule', pass: bad === 0 };
    });
    t('C2', 'Dummy data consistency (A-rank counts)', 'MCAT lists match metrics', () => {
      const issues = UC.DATA.SCENARIOS.flatMap(sc => UC.DATA.validate(UC.DATA.getScenarioSeller(sc.id)).map(x => sc.id + ': ' + x));
      return { actual: issues.length ? issues.join('; ') : 'All scenarios consistent', pass: issues.length === 0 };
    });
    t('C3', 'Unconfigured price is not invented', 'Premium MYR → null', () => {
      const v = P.lineMrp(cfg, 'IM_STAR_PRO', 'MYR', 'Premium');
      return { actual: String(v), pass: v === null };
    });
    t('C4', 'Multiple MCATs combined into ONE proposal', '1 proposal, ≥2 lines', () => {
      const st = S.newState(), s = UC.DATA.getScenarioSeller('5.1');
      S.revealRecommended(st, cfg, s);
      const drafts = S.workspace(st, '5.1').proposals.filter(x => x.status === 'Draft');
      return { actual: `${drafts.length} proposal · ${drafts[0].final.lines.length} MCAT lines`, pass: drafts.length === 1 && drafts[0].final.lines.length >= 2 };
    });
    return out;
  }
  return { run };
})();

</script>
  <script>/* ---- js/app.js ---- */
/* =====================================================================
 * APP CONTROLLER – state, navigation, events, persistence.
 * Business logic lives in js/engine/*; this file only wires UI to it.
 * ===================================================================== */
window.UC = window.UC || {};

UC.App = (function () {
  const S = UC.ProposalService, U = UC.Util;
  const STORE_KEY = 'uc-upsell-compass-proto';

  const app = {
    cfg: null, state: null,
    ui: { search: '', notifOpen: false, filterOpen: false, sheet: null, modal: null, sending: null, devTab: 'scenarios', testResults: null, animateReveal: false, desktopEmail: false }
  };

  /* ---------------- persistence (per-browser convenience only) ---------------- */
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ state: app.state, cfg: app.cfg })); } catch (e) { /* storage unavailable */ }
  }
  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return null;
      const d = JSON.parse(raw);
      if (!d.state || d.state.version !== S.newState().version) return null;
      return d;
    } catch (e) { return null; }
  }

  /* ---------------- context ---------------- */
  app.ctx = function () {
    const seller = UC.DATA.getScenarioSeller(app.state.scenarioId);
    const rec = UC.RecommendationEngine.evaluate(seller, app.cfg);
    const mcatRes = rec.journey === 'UPSELL' && rec.serviceKey && app.cfg.services[rec.serviceKey].mcatBased
      ? UC.McatEngine.evaluate(seller, rec.serviceKey, app.cfg) : null;
    const ws = S.workspace(app.state, app.state.scenarioId);
    return { seller, rec, mcatRes, ws };
  };

  /* ---------------- navigation ---------------- */
  function go(to) {
    const st = app.state;
    if (to === 'profile') st.history = [];
    else if (to === 'proposals') st.history = ['profile'];
    else if (st.screen !== to) st.history.push(st.screen);
    st.screen = to;
    app.ui.filterOpen = false;
  }
  function back() {
    const st = app.state;
    if (app.ui.sheet || app.ui.modal) { app.ui.sheet = null; app.ui.modal = null; return; }
    if (st.screen === 'edit' && st.editing && st.editing.dirty) {
      app.ui.modal = { title: 'Discard changes?', html: 'Your edits to this proposal have not been saved.', actions: [{ label: 'Keep editing', a: 'modal-close' }, { label: 'Discard', a: 'discard-edit', solid: true }] };
      return;
    }
    if (st.screen === 'sent') { go('proposals'); return; }
    const prev = st.history.pop();
    if (prev) st.screen = prev;
    else app.toast('You are on the seller profile.');
  }

  /* ---------------- toast ---------------- */
  let toastTimer = null;
  app.toast = function (msg) {
    const host = document.getElementById('toast-host');
    host.innerHTML = `<div class="toast">${U.esc(msg).replace(/\n/g, '<br>')}</div>`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { host.innerHTML = ''; }, 3200);
  };

  /* ---------------- render ---------------- */
  function render() {
    const st = app.state, root = document.getElementById('app-root');
    const prevScreen = root.dataset.screen, prevScroll = (document.getElementById('screen') || {}).scrollTop || 0;
    const { seller } = app.ctx();
    let content = '';
    switch (st.screen) {
      case 'profile': content = UC.UI.SellerProfile(app); break;
      case 'proposals': content = UC.UI.ProposalsScreen(app); break;
      case 'edit': content = st.editing ? UC.UI.ProposalEditor(app) : ''; break;
      case 'preview': content = UC.UI.EmailPreview(app); break;
      case 'sent': content = UC.UI.SentConfirmation(app); break;
    }
    let overlay = '';
    if (app.ui.sheet === 'mcat') overlay = UC.UI.McatPicker(app);
    if (app.ui.sheet === 'fab') overlay = `<div class="overlay" data-a="sheet-close-bg"><div class="sheet" data-stop="1">
        <div class="sh-hd"><span>New proposal</span><button class="xbtn" data-a="sheet-close" aria-label="Close">${UC.UI.icon.xcircle}</button></div>
        <div class="sh-bd"><button class="btn block" data-a="sheet-rec" style="margin-top:8px">View recommended proposal</button>
        <button class="btn block solid" data-a="manual" style="margin-top:10px">Create manual proposal</button></div></div></div>`;
    if (app.ui.modal) {
      const m = app.ui.modal;
      overlay += `<div class="overlay center" data-a="modal-close-bg"><div class="modal" data-stop="1"><b style="font-size:16px">${U.esc(m.title)}</b>
        <div style="margin:10px 0 16px;font-size:13px;line-height:1.55;color:var(--muted)">${m.html}</div>
        <div class="row" style="justify-content:flex-end;gap:8px">${m.actions.map(x => `<button class="btn sm ${x.solid ? 'solid' : ''}" data-a="${x.a}">${U.esc(x.label)}</button>`).join('')}</div></div></div>`;
    }
    if (app.ui.sending) overlay += UC.UI.Sending(app);

    root.innerHTML = UC.UI.header(app) + UC.UI.sellerBar(seller) +
      (st.screen === 'profile' || st.screen === 'proposals' ? UC.UI.subnav(st.screen) : '') +
      `<div class="screen" id="screen">${content}</div>` +
      (st.screen === 'proposals' ? `<button class="fab" data-a="fab" aria-label="Create proposal">${UC.UI.icon.plus}</button>` : '') +
      overlay;
    root.dataset.screen = st.screen;

    const scr = document.getElementById('screen');
    if (prevScreen === st.screen && !app.ui.scrollTop) scr.scrollTop = prevScroll;
    app.ui.scrollTop = false;
    if (st.screen === 'edit') UC.UI.refreshEditorNumbers(app);
    if (st.screen === 'preview') UC.UI.mountEmailFrame(app, document.getElementById('mailframe'), app.ui.currentEmailHtml);
    if (app.ui.animateReveal) {
      app.ui.animateReveal = false;
      requestAnimationFrame(() => requestAnimationFrame(() => { const r = document.getElementById('rec-reveal'); if (r) r.classList.add('in'); }));
    }
    renderDev();
    save();
  }

  function renderDev() {
    const dp = document.getElementById('devpanel');
    const ta = document.getElementById('cfg-text');
    if (ta && document.activeElement === ta) return; // don't wipe config being edited
    dp.innerHTML = UC.UI.DevPanel(app);
  }

  function renderDesktopEmail() {
    const host = document.getElementById('big-host');
    if (!app.ui.desktopEmail) { host.innerHTML = ''; return; }
    host.innerHTML = `<div class="big-modal"><div class="bar"><b>Desktop email preview</b><button class="btn sm solid" data-a="email-desktop-close">Close</button></div><iframe id="bigframe" title="Desktop email preview"></iframe></div>`;
    UC.UI.mountEmailFrame(app, document.getElementById('bigframe'), app.ui.currentEmailHtml);
  }

  /* ---------------- editor helpers ---------------- */
  function seller() { return UC.DATA.getScenarioSeller(app.state.scenarioId); }
  function openEditor(id) {
    const p = S.findProposal(app.state, app.state.scenarioId, id);
    const svc = p.final.serviceKey ? app.cfg.services[p.final.serviceKey] : null;
    app.state.editing = { scenarioId: app.state.scenarioId, proposalId: id, final: U.clone(p.final), tab: svc ? svc.tab : 'OTHERS', dirty: false, showErrors: false };
    go('edit');
  }
  function edited() { app.state.editing.dirty = true; }
  function commitEdit(thenPreview) {
    const ed = app.state.editing;
    const errs = S.validate(app.cfg, ed.final);
    ed.showErrors = true;
    if (errs.length) { UC.UI.refreshEditorNumbers(app); app.toast(errs[0]); return; }
    S.saveFinal(app.state, app.cfg, seller(), ed.proposalId, ed.final);
    const id = ed.proposalId;
    app.state.editing = null;
    if (thenPreview) {
      app.state.viewing = { scenarioId: app.state.scenarioId, proposalId: id };
      app.state.history = ['profile', 'proposals'];
      app.state.screen = 'preview';
    } else {
      go('proposals');
      app.toast('Proposal updated');
    }
  }

  function startSending(id) {
    const p = S.findProposal(app.state, app.state.scenarioId, id);
    const errs = S.validate(app.cfg, p.final);
    if (errs.length) { app.toast(errs[0]); return; }
    app.ui.sending = { step: 0 };
    render();
    const tick = (step, delay) => setTimeout(() => { app.ui.sending.step = step; render(); }, delay);
    tick(1, 550); tick(2, 1100); tick(3, 1650);
    setTimeout(() => {
      const res = S.sendProposal(app.state, app.cfg, seller(), id);
      app.ui.sending = null;
      if (!res.ok) { app.toast(res.errors[0]); render(); return; }
      app.state.viewing = { scenarioId: app.state.scenarioId, proposalId: id };
      app.state.history = ['profile', 'proposals'];
      app.state.screen = 'sent';
      app.ui.scrollTop = true;
      render();
    }, 2100);
  }

  /* ---------------- click actions ---------------- */
  const A = {
    back() { back(); },
    home() { app.state.editing = null; go('profile'); },
    notif() { app.ui.notifOpen = !app.ui.notifOpen; if (app.ui.notifOpen) setTimeout(() => { app.state.notifications.forEach(n => { n.read = true; }); save(); }, 0); },
    'notif-clear'() { app.state.notifications = []; },
    switch(el) {
      app.state.scenarioId = el.dataset.id;
      app.state.screen = 'profile'; app.state.history = []; app.state.editing = null;
      app.ui.search = ''; app.ui.sheet = null; app.ui.modal = null; app.ui.notifOpen = false; app.ui.scrollTop = true;
      document.getElementById('devpanel').classList.remove('open-mobile');
      app.toast('Switched to ' + UC.DATA.SELLERS[UC.DATA.SCENARIOS.find(s => s.id === el.dataset.id).sellerKey].name + ' · scenario ' + el.dataset.id);
    },
    go(el) { if (app.state.screen === 'edit' && app.state.editing && app.state.editing.dirty) { back(); return; } app.state.editing = null; go(el.dataset.to); app.ui.scrollTop = true; },
    filter() { app.ui.filterOpen = !app.ui.filterOpen; },
    'set-filter'(el) { app.state.filter = el.dataset.v; app.ui.filterOpen = false; },
    fab() {
      const { ws, seller: s } = app.ctx();
      if (!ws.revealed) {
        const p = S.revealRecommended(app.state, app.cfg, s);
        app.ui.animateReveal = true; app.ui.scrollTop = true;
        app.toast(p ? 'Recommended proposal generated' : 'No automatic proposal for this seller');
      } else app.ui.sheet = 'fab';
    },
    'sheet-rec'() {
      const { seller: s } = app.ctx();
      S.revealRecommended(app.state, app.cfg, s);
      app.ui.sheet = null; app.ui.scrollTop = true;
    },
    'dismiss-rec'() { S.workspace(app.state, app.state.scenarioId).revealed = false; },
    manual() { app.ui.sheet = null; const p = S.createManualDraft(app.state, app.cfg, seller()); openEditor(p.id); },
    edit(el) { openEditor(el.dataset.id); app.ui.scrollTop = true; },
    'send-preview'(el) { app.state.viewing = { scenarioId: app.state.scenarioId, proposalId: el.dataset.id }; go('preview'); app.ui.scrollTop = true; },
    'view-email'(el) { app.state.viewing = { scenarioId: app.state.scenarioId, proposalId: el.dataset.id }; go('preview'); app.ui.scrollTop = true; },
    receipt(el) {
      const p = S.findProposal(app.state, app.state.scenarioId, el.dataset.id);
      app.ui.modal = { title: 'Receipt', html: `Proposal ${p.id} · Proforma ${p.proforma}<br>No payment received yet – pending ${U.inr(p.pendingAmount)}.<br><i>Dummy MERP data for this prototype.</i>`, actions: [{ label: 'Close', a: 'modal-close', solid: true }] };
    },
    paylink(el) {
      const p = S.findProposal(app.state, app.state.scenarioId, el.dataset.id);
      app.ui.modal = { title: 'Pay Link', html: `A payment link for ${U.inr(p.pendingAmount)} would be shared with the seller.<br><code style="font-size:11px">https://seller.indiamart.com/pay?proforma=${p.proforma}</code><br><i>Simulated – nothing is sent.</i>`, actions: [{ label: 'Copy link', a: 'copy-paylink', solid: false }, { label: 'Close', a: 'modal-close', solid: true }] };
      app.ui.paylink = `https://seller.indiamart.com/pay?proforma=${p.proforma}`;
    },
    'copy-paylink'() { try { navigator.clipboard.writeText(app.ui.paylink); app.toast('Link copied'); } catch (e) { app.toast(app.ui.paylink); } app.ui.modal = null; },
    'modal-close'() { app.ui.modal = null; },
    'modal-close-bg'(el, ev) { if (ev.target === el) app.ui.modal = null; else return 'skip'; },
    'discard-edit'() { app.ui.modal = null; app.state.editing = null; const prev = app.state.history.pop(); app.state.screen = prev || 'proposals'; },

    // editor
    'ed-tab'(el) {
      const ed = app.state.editing; ed.tab = el.dataset.id;
      if (el.dataset.id !== 'OTHERS') {
        const key = Object.keys(app.cfg.services).find(k => app.cfg.services[k].tab === el.dataset.id);
        if (key && key !== ed.final.serviceKey) { S.applyService(ed.final, seller(), app.cfg, key); edited(); }
      }
    },
    'ed-clear-service'() { const f = app.state.editing.final; f.serviceKey = null; f.tenure = null; f.lines = []; edited(); },
    'ed-tenure'(el) {
      const f = app.state.editing.final;
      const list = UC.PricingEngine.tenuresFor(app.cfg, f.serviceKey);
      const i = (list.indexOf(f.tenure) + Number(el.dataset.dir) + list.length) % list.length;
      if (list[i] !== f.tenure) { S.setTenure(f, app.cfg, list[i]); edited(); }
      if (f.lines.some(l => l.mrp === null)) app.toast(`${list[i]} price not configured for some tiers`);
    },
    'mcat-remove'(el) { S.removeMcat(app.state.editing.final, el.dataset.id); edited(); },
    'mcat-add-open'() { app.ui.sheet = 'mcat'; },
    'mcat-add-confirm'() {
      const ids = Array.from(document.querySelectorAll('[data-in="pick"]:checked')).map(x => x.dataset.id);
      ids.forEach(id => S.addMcat(app.state.editing.final, seller(), app.cfg, id));
      app.ui.sheet = null;
      if (ids.length) { edited(); app.toast(`${ids.length} MCAT${ids.length > 1 ? 's' : ''} added`); }
    },
    'ed-toggle'(el) {
      const f = app.state.editing.final, k = el.dataset.k;
      f[k].on = !f[k].on;
      if (k === 'partPayment' && f[k].on && !f[k].advance) f[k].advance = Math.round(UC.PricingEngine.totals(app.cfg, f).payable / 2);
      edited();
    },
    'ed-update'() { commitEdit(false); },
    'ed-update-preview'() { commitEdit(true); },
    'send-final'(el) { startSending(el.dataset.id); return 'skip'; },
    'email-desktop'() { app.ui.desktopEmail = true; renderDesktopEmail(); return 'skip'; },
    'email-desktop-close'() { app.ui.desktopEmail = false; renderDesktopEmail(); return 'skip'; },
    'sheet-close'() { app.ui.sheet = null; },
    'sheet-close-bg'(el, ev) { if (ev.target === el) app.ui.sheet = null; else return 'skip'; },

    // dev panel
    'dev-tab'(el) { app.ui.devTab = el.dataset.id; if (el.dataset.id === 'tests' && !app.ui.testResults) app.ui.testResults = UC.Tests.run(app.cfg); },
    'run-tests'() { app.ui.testResults = UC.Tests.run(app.cfg); app.toast(`${app.ui.testResults.filter(r => r.pass).length}/${app.ui.testResults.length} tests passed`); },
    'export-tracking'() {
      const blob = new Blob([JSON.stringify(Object.values(app.state.tracking), null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'upsell-compass-tracking.json'; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      return 'skip';
    },
    'cfg-apply'() {
      let parsed;
      try { parsed = JSON.parse(document.getElementById('cfg-text').value); }
      catch (e) { app.toast('Config is not valid JSON: ' + e.message); return 'skip'; }
      app.cfg = parsed; dropDrafts(); app.ui.testResults = null;
      document.activeElement && document.activeElement.blur();
      app.toast('Config applied – unsent system drafts regenerated on next +');
    },
    'cfg-reset'() { app.cfg = U.clone(UC.DEFAULT_CONFIG); dropDrafts(); app.ui.testResults = null; document.activeElement && document.activeElement.blur(); app.toast('Default config restored'); },
    'reset-all'() {
      app.ui.modal = { title: 'Reset prototype?', html: 'Clears all generated / sent proposals, tracking records, notifications and config edits.', actions: [{ label: 'Cancel', a: 'modal-close' }, { label: 'Reset', a: 'reset-confirm', solid: true }] };
    },
    'reset-confirm'() { app.state = S.newState(); app.cfg = U.clone(UC.DEFAULT_CONFIG); app.ui.modal = null; app.ui.testResults = null; app.toast('Prototype reset'); },
    'dev-open'() { document.getElementById('devpanel').classList.add('open-mobile'); return 'skip'; },
    'dev-close'() { document.getElementById('devpanel').classList.remove('open-mobile'); return 'skip'; }
  };

  function dropDrafts() {
    Object.values(app.state.workspaces).forEach(ws => {
      ws.proposals = ws.proposals.filter(p => !(p.status === 'Draft' && p.origin === 'system'));
      ws.draftId = null; ws.revealed = false;
    });
    if (app.state.editing) { app.state.editing = null; app.state.screen = 'proposals'; app.state.history = ['profile']; }
  }

  /* ---------------- input actions (no full re-render while typing) ---------------- */
  const toNum = v => { const n = Number(String(v).replace(/[^\d.]/g, '')); return isNaN(n) ? 0 : n; };
  function onInput(el) {
    const ed = app.state.editing;
    const k = el.dataset.in;
    if (!ed) return;
    const f = ed.final;
    if (k === 'deal') f.lines[Number(el.dataset.idx)].deal = toNum(el.value);
    else if (k === 'pp-adv') f.partPayment.advance = toNum(el.value);
    else if (k === 'pp-days') f.partPayment.inst1Days = toNum(el.value);
    else if (k === 'tds-pct') f.tds.pct = toNum(el.value);
    else if (k === 'disc-pct') { f.discount.mode = 'pct'; f.discount.pct = toNum(el.value); f.discount.amt = 0; const o = document.querySelector('[data-in="disc-amt"]'); if (o) o.value = ''; }
    else if (k === 'disc-amt') { f.discount.mode = 'amt'; f.discount.amt = toNum(el.value); f.discount.pct = 0; const o = document.querySelector('[data-in="disc-pct"]'); if (o) o.value = ''; }
    else return;
    edited();
    UC.UI.refreshEditorNumbers(app);
    save();
  }
  function onChange(el) {
    const ed = app.state.editing;
    if (el.id === 'ed-service') {
      if (el.value) { S.applyService(ed.final, seller(), app.cfg, el.value); edited(); render(); }
      return;
    }
    if (!ed) return;
    const k = el.dataset.in;
    if (k === 'offer') { ed.final.discount.offerId = el.checked ? el.dataset.id : null; edited(); UC.UI.refreshEditorNumbers(app); save(); }
    if (k === 'valid') { ed.final.validTill = el.value; edited(); UC.UI.refreshEditorNumbers(app); save(); }
  }

  /* ---------------- boot ---------------- */
  function init() {
    const saved = load();
    app.state = saved ? saved.state : S.newState();
    app.cfg = saved && saved.cfg ? saved.cfg : U.clone(UC.DEFAULT_CONFIG);
    if (app.state.screen === 'edit' && !app.state.editing) app.state.screen = 'proposals';
    if ((app.state.screen === 'preview' || app.state.screen === 'sent') && !app.state.viewing) app.state.screen = 'proposals';

    document.addEventListener('click', ev => {
      const el = ev.target.closest('[data-a]');
      // close floating menus on outside click
      if (!ev.target.closest('.search') && app.ui.search) { app.ui.search = ''; const dd = document.getElementById('search-dd'); if (dd) dd.innerHTML = ''; const si = document.getElementById('seller-search'); if (si) si.value = ''; }
      if (!el) {
        if (app.ui.notifOpen && !ev.target.closest('.notif-pop')) { app.ui.notifOpen = false; render(); }
        if (app.ui.filterOpen && !ev.target.closest('.filter-pop')) { app.ui.filterOpen = false; render(); }
        return;
      }
      const fn = A[el.dataset.a];
      if (!fn) return;
      if (el.getAttribute('aria-disabled') === 'true' && el.dataset.a !== 'send-final') return;
      const r = fn(el, ev);
      if (el.dataset.a !== 'notif') app.ui.notifOpen = false;
      if (r !== 'skip') render();
    });
    document.addEventListener('input', ev => {
      if (ev.target.id === 'seller-search') {
        app.ui.search = ev.target.value;
        document.getElementById('search-dd').innerHTML = UC.UI.searchResults(app);
        return;
      }
      if (ev.target.dataset && ev.target.dataset.in && ev.target.type !== 'checkbox' && ev.target.type !== 'date') onInput(ev.target);
    });
    document.addEventListener('change', ev => onChange(ev.target));
    document.addEventListener('keydown', ev => {
      if (ev.key === 'Escape') {
        if (app.ui.desktopEmail) { app.ui.desktopEmail = false; renderDesktopEmail(); return; }
        if (app.ui.sheet || app.ui.modal || app.ui.notifOpen || app.ui.filterOpen) { app.ui.sheet = null; app.ui.modal = null; app.ui.notifOpen = false; app.ui.filterOpen = false; render(); }
      }
    });
    render();
  }

  app.init = init;
  app.render = render;
  return app;
})();

document.addEventListener('DOMContentLoaded', UC.App.init);

</script>
</body>
</html>
