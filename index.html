<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E05252">
  <title>Upsell Compass – MERP Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --red: #E05252; --red-dark: #D44747; --red-soft: #FDECEC;
  --ink: #1F1F1F; --muted: #6B6B6B; --line: #E4E4E4; --bg: #FFFFFF; --grey: #F4F4F4;
  --green: #22A12B; --amber: #B45309; --amber-soft: #FFF4E0; --blue: #2F5BEA; --blue-soft: #EEF3FF; --navy: #1F2A7C;
  --stage: #E9ECF2;
  --font: 'Lexend', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); color: var(--ink); background: var(--bg); font-size: 14px; }
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: 14px; }

/* ---------- stage (desktop preview) ---------- */
.stage { min-height: 100%; }
.device { position: relative; width: 100%; height: 100vh; height: 100dvh; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
.devpanel { display: none; }
@media (min-width: 980px) {
  body { background: var(--stage); }
  .stage { display: flex; gap: 28px; justify-content: center; align-items: flex-start; padding: 24px; }
  .device { width: 400px; height: min(860px, calc(100vh - 48px)); border-radius: 28px; border: 10px solid #1B1B1F; box-shadow: 0 20px 50px rgba(0,0,0,.25); flex: 0 0 auto; }
  .devpanel { display: flex; flex-direction: column; width: 560px; max-width: calc(100vw - 480px); height: calc(100vh - 48px); background: #fff; border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.08); overflow: hidden; }
  .dev-fab { display: none !important; }
}
.devpanel.open-mobile { display: flex; flex-direction: column; position: fixed; inset: 0; z-index: 200; background: #fff; }

/* ---------- MERP header ---------- */
.merp-header { background: var(--red); display: flex; align-items: center; gap: 10px; padding: 10px 12px; flex: 0 0 auto; position: relative; z-index: 20; }
.hbtn { background: none; border: 0; color: #fff; padding: 4px; display: inline-flex; align-items: center; justify-content: center; position: relative; }
.hbtn svg { width: 26px; height: 26px; }
.search { flex: 1; display: flex; align-items: center; background: #fff; border-radius: 6px; padding: 0 10px; height: 38px; position: relative; }
.search input { border: 0; outline: 0; flex: 1; font-size: 15px; min-width: 0; background: transparent; }
.search svg { width: 20px; height: 20px; }
.badge { position: absolute; top: -2px; right: -2px; background: #fff; color: var(--red); font-size: 10px; font-weight: 700; border-radius: 10px; min-width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--red); }
.dropdown { position: absolute; top: 46px; left: 0; right: 0; background: #fff; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.18); max-height: 340px; overflow: auto; z-index: 50; }
.dropdown .dd-item { padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 13px; cursor: pointer; }
.dropdown .dd-item:hover { background: var(--grey); }
.dd-item small { color: var(--muted); display: block; }
.notif-pop { position: absolute; top: 56px; right: 8px; width: 300px; max-width: calc(100% - 16px); }

/* ---------- seller bar + sub nav ---------- */
.seller-bar { text-align: center; padding: 12px 16px 0; flex: 0 0 auto; }
.seller-bar .nm { display: inline-block; padding-bottom: 8px; border-bottom: 1px solid #CFCFCF; font-weight: 600; font-size: 16px; }
.seller-bar .nm span { color: var(--muted); font-weight: 400; font-size: 13px; }
.subnav { display: flex; margin: 8px 16px 0; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
.subnav button { flex: 1; background: none; border: 0; padding: 10px 0; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; }
.subnav button.on { color: var(--red); border-color: var(--red); font-weight: 600; }

.screen { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; position: relative; }
.pad { padding: 14px 16px 24px; }
.section-title { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.section-title h2 { margin: 0; font-size: 19px; font-weight: 600; }

/* ---------- generic ---------- */
.card { border: 1px solid var(--line); border-radius: 10px; padding: 14px; background: #fff; margin-bottom: 12px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
.pill.sys { background: var(--blue-soft); color: var(--blue); }
.pill.warn { background: var(--amber-soft); color: var(--amber); }
.pill.ok { background: #E7F6E8; color: var(--green); }
.pill.red { background: var(--red-soft); color: var(--red); }
.pill.grey { background: var(--grey); color: var(--muted); }
.btn { border-radius: 6px; padding: 9px 16px; font-size: 14px; border: 1px solid var(--red); background: #fff; color: var(--red); }
.btn.solid { background: var(--red); color: #fff; }
.btn.block { display: block; width: 100%; padding: 14px; font-size: 16px; border-radius: 8px; }
.btn.ghost { border-color: var(--line); color: var(--ink); }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.btn[aria-disabled="true"] { opacity: .55; }
.link { background: none; border: 0; color: var(--blue); padding: 0; font-size: 13px; text-decoration: underline; }

/* ---------- profile ---------- */
.svc-line { display: flex; justify-content: space-between; padding: 12px 14px; background: var(--grey); border-radius: 10px; margin-bottom: 12px; font-size: 13px; }
.metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.metric { border: 1px solid var(--line); border-radius: 10px; padding: 10px 8px; text-align: center; }
.metric .v { font-size: 20px; font-weight: 600; }
.metric .l { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.3; }
.metric.bad { border-color: #F3B4B4; background: var(--red-soft); }
.metric.bad .v { color: var(--red); }
.compass { border: 1px solid #CBD7FF; border-radius: 12px; overflow: hidden; margin-bottom: 14px; }
.compass .top { background: linear-gradient(120deg, var(--navy), var(--blue)); color: #fff; padding: 14px; }
.compass .top .eyebrow { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; opacity: .8; display: flex; align-items: center; gap: 6px; }
.compass .top .rec { font-size: 22px; font-weight: 600; margin-top: 6px; }
.compass .top .sub { font-size: 12.5px; opacity: .9; margin-top: 4px; line-height: 1.45; }
.compass.servicing .top { background: linear-gradient(120deg, #8A4B08, #C97A12); }
.compass .body { padding: 12px 14px; }
details.why { border-top: 1px solid var(--line); }
details.why summary { list-style: none; padding: 12px 14px; font-weight: 600; font-size: 14px; cursor: pointer; display: flex; justify-content: space-between; }
details.why summary::-webkit-details-marker { display: none; }
details.why summary::after { content: '▾'; color: var(--muted); }
details.why[open] summary::after { content: '▴'; }
details.why .content { padding: 0 14px 14px; font-size: 13px; line-height: 1.55; }
.chk { display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
.chk .ic { width: 18px; flex: 0 0 18px; text-align: center; font-weight: 700; }
.chk .ic.ok { color: var(--green); } .chk .ic.bad { color: var(--red); } .chk .ic.info { color: var(--blue); }
.reason { background: var(--blue-soft); border-radius: 8px; padding: 10px; margin-top: 10px; font-size: 13px; line-height: 1.5; }
.compass.servicing .reason { background: var(--amber-soft); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #C9D6FF; background: var(--blue-soft); color: var(--navy); border-radius: 16px; padding: 5px 10px; font-size: 12.5px; }
.chip .rk { font-size: 10px; font-weight: 700; border-radius: 8px; padding: 1px 5px; background: var(--navy); color: #fff; }
.chip .rk.B { background: #7A8094; }
.chip.ext { border-color: #F2C27A; background: var(--amber-soft); color: #7A4A06; }
.chip button { background: none; border: 0; padding: 0 0 0 2px; color: inherit; font-size: 15px; line-height: 1; }
.mcat-reason { font-size: 12px; color: var(--muted); margin: 4px 0 10px; line-height: 1.45; }

table.eval { width: 100%; border-collapse: collapse; font-size: 11.5px; }
table.eval th, table.eval td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.eval th { color: var(--muted); font-weight: 500; }
table.eval tr.sel td { background: #F2F6FF; }
table.eval tr.no td { color: #A0A0A0; }

/* ---------- proposals list ---------- */
.reveal { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s ease; }
.reveal.in { grid-template-rows: 1fr; }
.reveal > div { overflow: hidden; }
.rec-section { background: linear-gradient(#F5F8FF, #fff); border-bottom: 6px solid #F1F1F1; }
.rec-section .hd { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 0; }
.rec-section .hd b { font-size: 15px; }
.pcard { padding: 16px; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.pcard .l1 { display: flex; justify-content: space-between; gap: 8px; }
.pcard .l1 .id { color: var(--muted); }
.pcard .l2 { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; color: var(--muted); }
.pcard .l2 b { color: var(--ink); font-weight: 400; }
.pcard .acts { display: flex; justify-content: space-between; gap: 10px; margin-top: 14px; }
.pcard.recommended { border: 1px solid #CBD7FF; border-radius: 12px; margin: 10px 16px 14px; background: #fff; box-shadow: 0 2px 10px rgba(47,91,234,.08); }
.pcard.recommended .amt { font-size: 20px; font-weight: 600; color: var(--ink); }
.status-Approved { color: var(--green) !important; }
.status-Sent { color: var(--blue) !important; font-weight: 600; }
.hold { background: var(--amber-soft); color: #7A4A06; border-radius: 8px; padding: 10px; font-size: 12.5px; margin-top: 10px; line-height: 1.45; }
.fab { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); width: 60px; height: 60px; border-radius: 50%; background: var(--red); color: #fff; border: 0; box-shadow: 0 6px 16px rgba(224,82,82,.45); display: flex; align-items: center; justify-content: center; z-index: 10; }
.fab svg { width: 30px; height: 30px; }
.list-bottom-space { height: 96px; }
.filter-pop { position: absolute; right: 12px; top: 48px; background: #fff; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.18); z-index: 30; min-width: 160px; }
.filter-pop button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 10px 14px; font-size: 13px; border-bottom: 1px solid var(--line); }
.filter-pop button.on { color: var(--red); font-weight: 600; }

/* ---------- editor ---------- */
.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.tabs button { flex: 0 0 auto; background: #fff; border: 1px solid #9A9A9A; border-radius: 6px; padding: 8px 12px; font-size: 14px; color: #555; }
.tabs button.on { border-color: var(--red); color: var(--ink); }
.select { position: relative; margin-top: 14px; width: 100%; }
.select select { width: 100%; appearance: none; -webkit-appearance: none; border: 1px solid #CFCFCF; border-radius: 6px; padding: 12px 40px 12px 14px; background: #fff; font-size: 15px; color: var(--ink); }
.select::after { content: '⌄'; position: absolute; right: 14px; top: 8px; font-size: 18px; color: #888; pointer-events: none; }
.banner { border-radius: 8px; padding: 10px 12px; font-size: 12.5px; line-height: 1.45; margin-top: 12px; }
.banner.sys { background: var(--blue-soft); color: var(--navy); }
.banner.chg { background: var(--amber-soft); color: #7A4A06; }
.svc-card { background: #F4F4F4; border: 1px solid #DADADA; border-radius: 10px; padding: 14px; margin-top: 14px; }
.svc-card .t { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 16px; }
.xbtn { background: none; border: 0; padding: 0; color: #888; }
.xbtn svg { width: 24px; height: 24px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid #CFCFCF; border-radius: 6px; background: #fff; }
.stepper button { background: none; border: 0; width: 32px; height: 30px; font-size: 18px; color: var(--ink); }
.stepper span { min-width: 44px; text-align: center; font-weight: 600; font-size: 13px; }
.line { background: #fff; border: 1px solid #E2E2E2; border-radius: 8px; padding: 10px; margin-top: 10px; }
.line .nm { font-weight: 600; font-size: 13.5px; }
.kv { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 13.5px; }
.kv .k { color: var(--muted); }
.inp { border: 0; border-bottom: 1px solid #9A9A9A; padding: 4px 2px; width: 110px; font-size: 15px; background: transparent; outline: 0; }
.inp:focus { border-color: var(--red); }
.inp.wide { width: 150px; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; font-size: 16px; color: #555; }
.sw { width: 52px; height: 30px; border-radius: 15px; background: #DADADA; border: 0; position: relative; transition: background .2s; flex: 0 0 auto; }
.sw::after { content: ''; position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: left .2s; }
.sw.on { background: var(--green); }
.sw.on::after { left: 26px; }
.sub-box { background: #FAFAFA; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 4px; font-size: 13px; }
.sum { border: 1px solid var(--line); border-radius: 10px; margin-top: 16px; overflow: hidden; }
.sum .r { display: flex; justify-content: space-between; padding: 8px 12px; font-size: 13px; border-bottom: 1px solid var(--line); }
.sum .r:last-child { border-bottom: 0; }
.sum .r.big { background: var(--grey); font-weight: 600; font-size: 14px; }
.err { background: var(--red-soft); color: #9B1C1C; border-radius: 8px; padding: 10px 12px; font-size: 12.5px; margin-top: 12px; }
.sticky-bottom { position: sticky; bottom: 0; background: #fff; padding: 12px 0 4px; display: flex; gap: 10px; }
.sticky-bottom .btn { flex: 1; padding: 13px; font-size: 15px; }

/* ---------- sheet / modal ---------- */
.overlay { position: absolute; inset: 0; background: rgba(0,0,0,.4); z-index: 60; display: flex; align-items: flex-end; animation: fade .2s; }
.overlay.center { align-items: center; justify-content: center; padding: 20px; }
.sheet { background: #fff; width: 100%; max-height: 85%; border-radius: 16px 16px 0 0; display: flex; flex-direction: column; animation: up .25s ease; }
.sheet .sh-hd { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); font-weight: 600; }
.sheet .sh-bd { overflow-y: auto; padding: 8px 16px 16px; }
.modal { background: #fff; border-radius: 14px; padding: 18px; width: 100%; max-width: 340px; animation: up .2s; }
.pick { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.pick input { margin-top: 3px; accent-color: var(--red); width: 18px; height: 18px; }
.pick .meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
.pick.out .nm { color: #9B1C1C; }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }

/* ---------- email preview / sent ---------- */
.mailhead { border: 1px solid var(--line); border-radius: 10px; font-size: 13px; overflow: hidden; }
.mailhead .r { display: flex; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.mailhead .r:last-child { border-bottom: 0; }
.mailhead .k { color: var(--muted); width: 54px; flex: 0 0 54px; }
.mailframe { width: 100%; border: 1px solid var(--line); border-radius: 10px; margin-top: 12px; min-height: 400px; background: #EEF2F8; display: block; }
.big-modal { position: fixed; inset: 0; z-index: 300; background: rgba(10,15,30,.6); display: flex; flex-direction: column; align-items: center; padding: 20px; }
.big-modal .bar { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; color: #fff; margin-bottom: 10px; gap: 10px; }
.big-modal iframe { width: 100%; max-width: 900px; flex: 1; border: 0; border-radius: 10px; background: #EEF2F8; }
.sending { position: absolute; inset: 0; background: rgba(255,255,255,.96); z-index: 80; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 24px; }
.spinner { width: 56px; height: 56px; border-radius: 50%; border: 5px solid #F3D0D0; border-top-color: var(--red); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.steps { font-size: 13px; color: var(--muted); line-height: 1.9; text-align: left; }
.steps .done { color: var(--green); }
.success { text-align: center; padding: 26px 18px 10px; }
.tick { width: 74px; height: 74px; border-radius: 50%; background: #E7F6E8; color: var(--green); display: inline-flex; align-items: center; justify-content: center; font-size: 40px; animation: pop .4s ease; }
@keyframes pop { 0% { transform: scale(.4); } 80% { transform: scale(1.1); } }
.kvlist { border: 1px solid var(--line); border-radius: 10px; margin: 16px 0; text-align: left; }
.kvlist .r { display: flex; justify-content: space-between; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
.kvlist .r:last-child { border-bottom: 0; }
.kvlist .r span:last-child { text-align: right; font-weight: 600; word-break: break-all; }

.toast { position: absolute; left: 50%; bottom: 92px; transform: translateX(-50%); background: #222; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; z-index: 120; max-width: 88%; text-align: center; animation: up .2s; }
.dev-fab { position: fixed; left: 0; top: 42%; z-index: 150; background: #1B1B1F; color: #fff; border: 0; border-radius: 10px 0 0 10px; /* appears on the right after rotate */ padding: 10px 6px; font-size: 11px; writing-mode: vertical-rl; transform: rotate(180deg); box-shadow: 0 4px 12px rgba(0,0,0,.3); opacity: .85; }

/* ---------- dev panel ---------- */
.dp-hd { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
.dp-hd b { font-size: 15px; }
.dp-tabs { display: flex; border-bottom: 1px solid var(--line); }
.dp-tabs button { flex: 1; background: none; border: 0; padding: 10px; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; }
.dp-tabs button.on { color: var(--ink); border-color: var(--ink); font-weight: 600; }
.dp-bd { flex: 1; overflow: auto; padding: 12px 16px 20px; font-size: 13px; }
.sc-group { margin-bottom: 10px; }
.sc-group h4 { margin: 10px 0 6px; font-size: 13px; }
.sc-item { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; font-size: 13px; }
.sc-item.on { border-color: var(--red); background: var(--red-soft); }
.sc-item small { display: block; color: var(--muted); margin-top: 2px; }
table.dt { width: 100%; border-collapse: collapse; font-size: 12px; }
table.dt th, table.dt td { border-bottom: 1px solid var(--line); padding: 6px 4px; text-align: left; vertical-align: top; }
table.dt th { color: var(--muted); font-weight: 500; }
.pass { color: var(--green); font-weight: 700; } .fail { color: var(--red); font-weight: 700; }
textarea.cfg { width: 100%; height: 420px; font-family: Consolas, monospace; font-size: 11.5px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
.kpis div { border: 1px solid var(--line); border-radius: 8px; padding: 8px; text-align: center; }
.kpis b { display: block; font-size: 18px; }

</style>
  <style>@media (min-width: 980px) { .dp-close { display: none; } }</style>
</head>
<body>
  <div class="stage">
    <div class="device">
      <div id="app-root" style="display:flex;flex-direction:column;height:100%;position:relative;"></div>
      <div id="toast-host"></div>
    </div>
    <aside class="devpanel" id="devpanel" aria-label="Development and testing panel"></aside>
  </div>
  <div id="big-host"></div>
  <button class="dev-fab" data-a="dev-open">🧪 Test panel</button>

  <!-- 1. Configuration + dummy data -->
  <script>/* ---- js/config.js ---- */
/* =====================================================================
 * UPSELL COMPASS – CONFIGURATION
 * All business thresholds, rule tables, MCAT selection order and prices
 * live here. Screens never hard-code these values.
 * (Also editable live from the Dev Panel → Config tab.)
 * ===================================================================== */
window.UC = window.UC || {};

UC.DEFAULT_CONFIG = {
  meta: {
    version: '0.1-prototype',
    pricingSource: 'Copy of Services list _ Prices _ BL Alocation.xlsx → "Sale Price" + "Differential Price" sheets'
  },

  gstRate: 0.18,
  defaultValidityDays: 7,
  tdsDefaultPct: 2,               // editable on the proposal; confirm the applicable section with Finance
  recipientEmail: 'prakhar.mathur@indiamart.com',
  executive: {                    // dummy executive shown in the email signature
    name: 'Aman Verma',
    designation: 'Client Relationship Executive',
    phone: '+91-79-4716-0000',

  <script>/* ---- js/engine/utils.js ---- */
/* Shared helpers – no UI, no business rules. */
window.UC = window.UC || {};

UC.Util = (function () {
  const OPS = {
    '<':  (a, b) => a < b,
    '<=': (a, b) => a <= b,
    '>':  (a, b) => a > b,
    '>=': (a, b) => a >= b,
    '==': (a, b) => a === b,
    '!=': (a, b) => a !== b
  };
  const OP_TEXT = { '<': '<', '<=': '≤', '>': '>', '>=': '≥', '==': '=', '!=': '≠' };
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  function compare(value, cond) {
    if (!OPS[cond.op]) throw new Error('Unknown operator ' + cond.op);
    return OPS[cond.op](value, cond.value);
  }
  function condText(cond, unit) { return `${OP_TEXT[cond.op]} ${cond.value}${unit || ''}`; }

  function inr(n) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    const neg = n < 0; n = Math.round(Math.abs(n));
    const s = String(n);
    const last3 = s.slice(-3), rest = s.slice(0, -3);
    const out = rest ? rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + last3 : last3;
    return (neg ? '-' : '') + '₹' + out;
  }
  function num(n) { return inr(n).replace('₹', ''); }

  function toDate(d) { return d instanceof Date ? d : new Date(d + (String(d).length === 10 ? 'T00:00:00' : '')); }
  function isoDate(d) {
    d = toDate(d);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  function fmtDate(d) { d = toDate(d); return `${String(d.getDate()).padStart(2, '0')}-${MONTHS[d.getMonth()]}-${d.getFullYear()}`; }
  function fmtDateShort(d) { d = toDate(d); return `${String(d.getDate()).padStart(2, '0')}-${MONTHS[d.getMonth()]}-${String(d.getFullYear()).slice(2)}`; }
  function fmtDateTime(d) {
    d = toDate(d);
    return `${fmtDate(d)}, ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  }
  function addDays(d, n) { const x = new Date(toDate(d)); x.setDate(x.getDate() + n); return x; }
  function today() { return isoDate(new Date()); }

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  return { compare, condText, inr, num, isoDate, fmtDate, fmtDateShort, fmtDateTime, addDays, today, clone, esc, OP_TEXT };
})();

 * Pure function: (seller, config) -> recommendation object. No UI.

  const U = UC.Util;

  function evaluate(seller, cfg) {
    const mt = seller.metrics;
    const svcName = k => (cfg.services[k] || {}).name || k;

    // ---- A. First-level servicing checks ----
    const checks = cfg.servicing.checks.map(c => {

      const triggered = U.compare(value, c);

    return {
      journey: 'UPSELL',
      headline: svc.name,
      checks, triggered: [],
      ruleId: rule.id,
      matchedRules: matches.map(r => r.id),
      serviceKey: rule.serviceKey,

      proposalAllowed: true,

        .concat([
          `Opted A Rank MCATs: ${mt.optedARank}`,
          `Preferred Districts: ${mt.preferredDistricts}`,
          `Matched rule ${rule.id}: ${condLines.join(' and ')} → ${svc.name}`,
          `Recommendation reason: ${rule.reason}`
        ])

  <script>/* ---- js/engine/mcat-engine.js ---- */
/* =====================================================================
 * MCAT SELECTION ENGINE
 * (seller, serviceKey, config) -> eligibility of every MCAT + selection.
 * Selection order and tie-breaks come from config (still to be confirmed
 * by business), so they can change without touching this code.
 * ===================================================================== */
window.UC = window.UC || {};

UC.McatEngine = (function () {
  const U = UC.Util;

  function optedBand(seller, cfg) {
    const b = cfg.mcatOptedBand;
    return U.compare(seller.metrics[b.metric], b) ? b.aboveKey : b.belowKey;
  }

  /** Which MCAT criteria apply for this seller + service. null for non-MCAT services. */
  function scenarioKeyFor(seller, serviceKey, cfg) {
    const svc = cfg.services[serviceKey];
    if (!svc || !svc.mcatBased) return null;
    const band = optedBand(seller, cfg);
    const key = Object.keys(cfg.mcatScenarios).find(k => {
      const s = cfg.mcatScenarios[k];
      return s.band === band && s.serviceKey === serviceKey;
    });
    return key || null;
  }

  function sortBy(list, tieBreak) {
    return list.slice().sort((a, b) => {
      for (const t of tieBreak) {
        const av = a[t.field], bv = b[t.field];
        if (av === bv) continue;
        const r = av < bv ? -1 : 1;
        return t.dir === 'desc' ? -r : r;
      }
      return 0;
    });
  }

  function evaluate(seller, serviceKey, cfg) {
    const scKey = scenarioKeyFor(seller, serviceKey, cfg);
    if (!scKey) return { applicable: false, scenarioKey: null, mcats: [], selected: [], status: 'NA' };
    const sc = cfg.mcatScenarios[scKey];
    const preferOpted = sc.prefer === 'opted';
    const prefText = preferOpted ? 'opted (preferred for ≤3 opted A-rank sellers)' : 'non-opted (preferred for >3 opted A-rank sellers)';
    const critLabels = { dirListingRank: 'DIR IM listing rank', last30BL: 'Last 30-day BL' };

    // 1. Eligibility of every MCAT
    const mcats = seller.mcats.map(mc => {
      const fails = [], passes = [];
      Object.keys(sc.criteria).forEach(f => {
        const c = sc.criteria[f];
        const ok = U.compare(mc[f], c);
        (ok ? passes : fails).push(`${critLabels[f] || f} ${mc[f]} ${ok ? '' : 'not '}${U.condText(c)}`.replace('  ', ' '));
      });
      return Object.assign({}, mc, {
        eligible: fails.length === 0,
        preferred: mc.opted === preferOpted,
        criteriaPass: passes, criteriaFail: fails,
        selected: false, stepId: null, selectionReason: null,
        eligibilityText: fails.length ? 'Not eligible – ' + fails.join('; ') : 'Eligible – ' + passes.join('; ')
      });
    });

    // 2. Fill target slots step by step
    const selected = [];
    cfg.mcatSelectionOrder.forEach(step => {
      if (!step.enabled || selected.length >= sc.targetCount) return;
      const cands = mcats.filter(x => x.eligible && !x.selected && x.rank === step.rank &&
        (step.optedStatus === 'preferred' ? x.preferred : !x.preferred));
      sortBy(cands, cfg.mcatTieBreak).forEach(x => {
        if (selected.length >= sc.targetCount) return;
        x.selected = true; x.stepId = step.id;
        const base = `${x.rank}-rank · ${x.opted ? 'opted' : 'non-opted'} · ${x.criteriaPass.join(' · ')}`;
        x.selectionReason = step.rank === 'A' && step.optedStatus === 'preferred'
          ? `${base}. Selected first: A-rank and ${prefText}.`
          : step.rank === 'B'
            ? `${base}. B-rank fallback – not enough eligible A-rank MCATs matching the preference.`
            : `${base}. Selected by step ${step.id}: ${step.label}.`;
        selected.push(x);
      });
    });

    // 3. Explain the eligible-but-not-selected ones
    mcats.forEach(x => {
      if (x.eligible && !x.selected) {
        const step = cfg.mcatSelectionOrder.find(s => s.rank === x.rank && (s.optedStatus === 'preferred' ? x.preferred : !x.preferred));
        x.selectionReason = step && !step.enabled
          ? `Eligible, but not auto-selected: step ${step.id} (${step.label}) is switched off. Executive can add it.`
          : `Eligible, not auto-selected – target of ${sc.targetCount} already reached. Executive can add it.`;
      }
      if (!x.eligible) x.selectionReason = x.eligibilityText;
    });

    const status = selected.length === 0 ? 'HELD' : selected.length < sc.targetCount ? 'PARTIAL' : 'FULL';
    const statusText = {
      HELD: `No MCAT met the criteria – MCAT recommendation held for executive intervention.`,
      PARTIAL: `Only ${selected.length} of ${sc.targetCount} target MCATs qualified – proposal generated with the available MCATs.`,
      FULL: `${selected.length} of ${sc.targetCount} target MCATs selected.`
    }[status];
    return {
      applicable: true, scenarioKey: scKey, scenario: sc, band: optedBand(seller, cfg),
      targetCount: sc.targetCount, prefer: sc.prefer,
      mcats, selected, status, statusText,
      eligible: mcats.filter(x => x.eligible)
    };
  }

  return { evaluate, scenarioKeyFor, optedBand };
})();

</script>
  <script>/* ---- js/engine/pricing-engine.js ---- */
/* =====================================================================
 * PRICING ENGINE – reads price config only. MRP and Deal Value are kept
 * separate. All MRPs are ex-GST; card "Amount" is GST-inclusive like MERP.
 * ===================================================================== */
window.UC = window.UC || {};

UC.PricingEngine = (function () {
  function service(cfg, key) { return cfg.services[key]; }

  function tenuresFor(cfg, key) {
    const s = service(cfg, key);
    if (!s) return [];
    return Object.keys(s.mcatBased ? s.tierPrices : s.prices);
  }

  /** MRP for one line. Returns null when the price is not configured. */
  function lineMrp(cfg, serviceKey, tenure, tier) {
    const s = service(cfg, serviceKey);
    if (!s) return null;
    if (s.mcatBased) {
      const t = (s.tierPrices[tenure] || {});
      return t[tier] === undefined ? null : t[tier];
    }
    const p = s.prices[tenure];
    return p === undefined ? null : p;
  }

  function lineTitle(cfg, final, line) {
    const s = service(cfg, final.serviceKey);
    const name = s ? s.name : final.serviceKey;
    return line.kind === 'mcat' ? `${name} – ${line.name} – ${final.tenure}` : `${name} – ${final.tenure}`;
  }

  function totals(cfg, final) {
    const lines = final.lines || [];
    const missing = lines.some(l => l.mrp === null || l.mrp === undefined);
    const mrpTotal = lines.reduce((a, l) => a + (l.mrp || 0), 0);
    const dealTotal = lines.reduce((a, l) => a + (Number(l.deal) || 0), 0);
    let discountAmt = 0;
    const d = final.discount || {};
    if (d.on) {
      discountAmt = d.mode === 'amt' ? Number(d.amt) || 0 : Math.round(dealTotal * (Number(d.pct) || 0) / 100);
      discountAmt = Math.min(Math.max(discountAmt, 0), dealTotal);
    }
    const netDeal = dealTotal - discountAmt;
    const gst = Math.round(netDeal * cfg.gstRate);
    const amountInclGst = netDeal + gst;
    const tdsAmt = final.tds && final.tds.on ? Math.round(netDeal * (Number(final.tds.pct) || 0) / 100) : 0;
    const payable = amountInclGst - tdsAmt;
    const offer = d.on && d.offerId ? cfg.offers.find(o => o.id === d.offerId) : null;
    const offerApplicable = offer ? netDeal >= (offer.minDeal || 0) : false;
    let advance = payable, balance = 0;
    if (final.partPayment && final.partPayment.on) {
      advance = Math.min(Math.max(Number(final.partPayment.advance) || 0, 0), payable);
      balance = payable - advance;
    }
    return { mrpTotal, dealTotal, discountAmt, netDeal, gst, amountInclGst, tdsAmt, payable, missing, offer, offerApplicable, advance, balance };
  }

  return { service, tenuresFor, lineMrp, lineTitle, totals };
})();

      <div style="width:46px;height:46px;border-radius:50%;background:${NAVY};color:#fff;font:700 18px/46px Arial;text-align:center;">${e(x.name.split(' ').map(s => s[0]).join(''))}</div>
      <div style="flex:1 1 200px;font-size:13px;line-height:1.6;color:${INK};">
        <div style="font-size:12px;color:${MUTED};">Your IndiaMART contact</div>
        <b>${e(x.name)}</b> · ${e(x.designation)}<br>
        <a href="tel:${e(x.phone)}" style="color:${BLUE};text-decoration:none;">${e(x.phone)}</a> · <a href="mailto:${e(x.email)}" style="color:${BLUE};text-decoration:none;">${e(x.email)}</a>
      </div>
    </div>`;
  }

  function footer(p, cfg) {
    return `
    <div style="margin:22px 24px 0;border:1px solid ${LINE};border-radius:8px;overflow:hidden;">
      <div style="background:#F4F6FA;padding:8px 12px;font-weight:700;font-size:13px;color:${NAVY};">Happy to Help</div>
      <div style="padding:10px 12px;font-size:13px;line-height:1.7;color:${INK};"><b>Email:</b> ${e(cfg.support.email)}<br><b>Call Us:</b> ${e(cfg.support.phone)}</div>
    </div>
    <div style="padding:16px 24px 24px;font-size:11px;line-height:1.6;color:#8A93A6;">
      This proposal is valid till ${U.fmtDate(p.final.validTill)}. Service benefits are delivered as per the terms of the selected plan.
      Visibility, enquiries and BuyLead volumes depend on buyer demand and are not guaranteed. Prices are in INR; GST as applicable.
    </div>`;
  }

  /* ---------- scenario content modules ---------- */
  const SCENARIOS = {
    RENEWAL_MYR(p, seller, cfg, t) {
      const isMyr = p.final.tenure === 'MYR';
      const cur = seller.currentService;
      const opted = seller.mcats.filter(m => m.opted).map(m => m.name);
      const svc = cfg.services.INDIA_STAR;
      const curTen = cfg.tenures[cur.tenure].long;
      const comp = `
        <table role="presentation" style="width:100%;border-collapse:collapse;font-size:13px;border:1px solid ${LINE};">
          <tr style="background:${LIGHT};color:${NAVY};"><th style="padding:9px 10px;text-align:left;"></th>
            <th style="padding:9px 10px;text-align:right;">India Star 1Y<br><span style="font-weight:400;color:${MUTED}">current</span></th>
            <th style="padding:9px 10px;text-align:right;background:${NAVY};color:#fff;">India Star ${e(p.final.tenure)}<br><span style="font-weight:400;color:#C9D6FF">proposed</span></th></tr>
          <tr><td style="padding:9px 10px;border-top:1px solid ${LINE};color:${MUTED};">Tenure</td><td style="padding:9px 10px;border-top:1px solid ${LINE};text-align:right;">1 Year</td><td style="padding:9px 10px;border-top:1px solid ${LINE};text-align:right;font-weight:700;">${e(cfg.tenures[p.final.tenure].long)}</td></tr>
          <tr><td style="padding:9px 10px;border-top:1px solid ${LINE};color:${MUTED};">MRP (excl. GST)</td><td style="padding:9px 10px;border-top:1px solid ${LINE};text-align:right;">${U.inr(svc.prices['1Y'])}</td><td style="padding:9px 10px;border-top:1px solid ${LINE};text-align:right;font-weight:700;">${U.inr(t.mrpTotal)}</td></tr>
          <tr><td style="padding:9px 10px;border-top:1px solid ${LINE};color:${MUTED};">Proposed Deal Value</td><td style="padding:9px 10px;border-top:1px solid ${LINE};text-align:right;color:#9AA3B5;">—</td><td style="padding:9px 10px;border-top:1px solid ${LINE};text-align:right;font-weight:700;color:${NAVY};">${U.inr(t.netDeal)}</td></tr>
          <tr><td style="padding:9px 10px;border-top:1px solid ${LINE};color:${MUTED};">Renewal cycle</td><td style="padding:9px 10px;border-top:1px solid ${LINE};text-align:right;">Every year</td><td style="padding:9px 10px;border-top:1px solid ${LINE};text-align:right;font-weight:700;">${isMyr ? 'Once for the full term' : 'Every year'}</td></tr>
        </table>`;
      return {
        subject: isMyr
          ? `Proposal ${p.id}: Continue India Star with a multi-year subscription – ${seller.name}`
          : `Proposal ${p.id}: Renew your India Star subscription – ${seller.name}`,
        hero: hero('RENEWAL_MYR', 'India Star · Subscription continuity',
          isMyr ? 'Continue your IndiaMART journey with a longer-term subscription' : 'Continue your IndiaMART journey with India Star',
          isMyr ? 'Keep the India Star benefits you use today running across a multi-year term, without yearly renewal cycles.'
                : 'Renew India Star so your listing and categories continue without a break.'),
        body: [
          para(`Thank you for being an India Star member. Your current subscription is <b>India Star – ${e(curTen)}</b>. ${isMyr
            ? `We have prepared a proposal to move it to a <b>Multi-Year (MYR)</b> tenure, so everything you use today continues uninterrupted.`
            : `We have prepared a renewal proposal so your services continue uninterrupted.`}`),
          h2('Your current subscription'),
          `<div style="padding:14px;border:1px solid ${LINE};border-radius:10px;">
             <div style="font-size:13px;color:${MUTED};">Plan</div><div style="font-weight:700;font-size:15px;color:${INK};margin-bottom:10px;">India Star – ${e(curTen)}</div>
             <div style="font-size:13px;color:${MUTED};margin-bottom:6px;">Categories currently in your plan</div>
             ${opted.length ? opted.map(n => chip(e(n))).join('') : '<span style="font-size:13px;color:' + MUTED + '">As per your current listing</span>'}
           </div>`,
          h2(isMyr ? 'What continues with India Star MYR' : 'What continues with your renewal'),
          featureGrid([
            { icon: '★', title: 'Same India Star listing', text: 'Your India Star plan and its listing benefits continue as they are today.' },
            { icon: '◎', title: 'Your categories stay live', text: 'Categories in your plan remain active through the term, with no gap at renewal time.' },
            { icon: '↓', title: 'BuyLead access as per plan', text: 'Continue to access BuyLeads according to your India Star plan entitlements.' },
            { icon: '⟳', title: isMyr ? 'One proposal, multi-year term' : 'Quick renewal', text: isMyr ? 'A single agreement covers the full term – fewer renewal follow-ups for your team.' : 'Renew now and avoid a break in your subscription.' }
          ]),
          h2('Commercial comparison'),
          comp
        ]
      };
    },

    UPSELL_ISP(p, seller, cfg, t) {
      const lines = p.final.lines.filter(l => l.kind === 'mcat');
      const mcatOf = id => seller.mcats.find(m => m.id === id) || {};
      const first = lines[0] ? lines[0].name : 'your categories';
      return {
        subject: `Proposal ${p.id}: Upgrade to IM Star Pro for ${first}${lines.length > 1 ? ' & more' : ''} – ${seller.name}`,
        hero: hero('UPSELL_ISP', 'Upgrade · India Star → IM Star Pro', 'Take your product visibility to the next level',
          'Add category-level visibility for the products you most want buyers to find.'),
        body: [
          para(`Your India Star listing gives you a strong base on IndiaMART. Looking at how your listing is placed in specific product categories, we recommend adding <b>IM Star Pro</b> for the categories below.`),
          `<div class="grid" style="display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;margin:6px 0 4px;">
             <div class="cell" style="flex:1 1 200px;padding:14px;border:1px solid ${LINE};border-radius:10px;">
               <div style="font-size:11px;color:${MUTED};text-transform:uppercase;letter-spacing:1px;">You have today</div>
               <div style="font-weight:700;color:${INK};margin-top:4px;">India Star – ${e(seller.currentService.tenure)}</div>
               <div style="font-size:13px;color:${MUTED};margin-top:4px;">Listing across the categories in your plan</div></div>
             <div style="flex:0 0 auto;align-self:center;font-size:22px;color:${BLUE};margin:0 auto;">➜</div>
             <div class="cell" style="flex:1 1 200px;padding:14px;border-radius:10px;background:${NAVY};color:#fff;">
               <div style="font-size:11px;color:#C9D6FF;text-transform:uppercase;letter-spacing:1px;">Add</div>
               <div style="font-weight:700;margin-top:4px;">IM Star Pro – ${e(p.final.tenure)}</div>
               <div style="font-size:13px;color:#E3EAFF;margin-top:4px;">Dedicated visibility in ${lines.length} recommended categor${lines.length === 1 ? 'y' : 'ies'}</div></div>
           </div>`,
          h2('Your recommended categories'),
          lines.map(l => {
            const m = mcatOf(l.mcatId);
            return `<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 14px;border:1px solid ${LINE};border-left:4px solid ${BLUE};border-radius:8px;margin-bottom:8px;">
              <div><div style="font-weight:700;color:${INK};font-size:15px;">${e(l.name)}</div>
                <div style="font-size:12px;color:${MUTED};margin-top:3px;">Your current listing position: #${e(m.dirListingRank || '—')} · ${m.opted ? 'Already in your plan – strengthen it' : 'Not yet in your India Star plan'}</div></div>
              <div style="text-align:right;font-size:12px;color:${MUTED};">${e(l.tier)} tier<br><b style="color:${NAVY};font-size:14px;">${U.inr(l.deal)}</b></div></div>`;
          }).join(''),
          h2('What IM Star Pro adds'),
          featureGrid([
            { icon: '◉', title: 'Category-level visibility', text: 'Placement within each selected category as per the IM Star Pro plan.' },
            { icon: '↓', title: 'Category BuyLeads', text: 'Access to BuyLeads in the selected categories as per plan allocation.' },
            { icon: '+', title: 'Works with India Star', text: 'Your India Star subscription continues unchanged – IM Star Pro is added on top.' }
          ]),
          h2('Package details'),
          packageLines(p, cfg)
        ]
      };
    },

    UPSELL_PSP(p, seller, cfg, t) {
      const lines = p.final.lines.filter(l => l.kind === 'mcat');
      const d = seller.districts || [];
      const show = d.slice(0, 12);
      return {
        subject: `Proposal ${p.id}: Expand your reach across ${d.length} districts with Preferred Star Pro – ${seller.name}`,
        hero: hero('UPSELL_PSP', 'Upgrade · India Star → Preferred Star Pro', 'Expand your business reach with Preferred Star Pro',
          'Be a preferred supplier for buyers in the districts that matter to your business.'),
        body: [
          para(`You have marked <b>${d.length} preferred districts</b> on IndiaMART. <b>Preferred Star Pro</b> is built for sellers who serve buyers across many locations – it adds preferred listing for your chosen categories across your preferred districts.`),
          `<div class="grid" style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:16px;border-radius:12px;background:${LIGHT};">
             <div style="flex:0 0 130px;text-align:center;margin:0 auto;">
               <div style="font:700 44px/1 Arial;color:${NAVY};">${d.length}</div>
               <div style="font-size:12px;color:${MUTED};margin-top:4px;">preferred districts</div></div>
             <div style="flex:1 1 260px;">
               <div style="font-size:12px;color:${MUTED};margin-bottom:6px;">Your coverage includes</div>
               ${show.map(x => chip(e(x))).join('')}${d.length > show.length ? chip(`+${d.length - show.length} more`, true) : ''}</div>
           </div>`,
          h2('How geographic reach works'),
          featureGrid([
            { icon: '1', title: 'Your districts', text: 'Your preferred districts define where you want to be seen first.' },
            { icon: '2', title: 'Preferred listing', text: 'Buyers in those districts see you as a preferred supplier in the selected categories, as per plan.' },
            { icon: '3', title: 'Location-aligned BuyLeads', text: 'BuyLeads from your preferred locations as per Preferred Star Pro plan allocation.' }
          ]),
          h2('Categories in this proposal'),
          `<div>${lines.map(l => chip(`${e(l.name)} · ${e(l.rank)} rank`)).join('')}</div>`,
          para(`<span style="font-size:13px;color:${MUTED};">Your India Star subscription continues unchanged – Preferred Star Pro is added on top.</span>`),
          h2('Package details'),
          packageLines(p, cfg)
        ]
      };
    },

    GENERIC(p, seller, cfg, t) {
      const svc = cfg.services[p.final.serviceKey];
      return {
        subject: `Proposal (${p.id}) for IndiaMART Services – ${svc.name}`,
        hero: hero('GENERIC', 'Your IndiaMART proposal', `Your proposal for ${e(svc.name)}`,
          'Here are the details of the service we discussed with you.'),
        body: [
          para(`Thank you for your interest in IndiaMART services. Please find the details of your <b>${e(svc.name)}</b> proposal below.`),
          h2('Package details'),
          packageLines(p, cfg)
        ]
      };
    }
  };

  /* ---------- assemble ---------- */
  function build(p, seller, cfg) {
    const sc = resolveScenario(p, seller);
    const t = P.totals(cfg, p.final);
    const c = SCENARIOS[sc](p, seller, cfg, t);
    const html = `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>${e(c.subject)}</title>
<style>
  body{margin:0;background:#EEF2F8;font-family:Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%;}
  @media (max-width:480px){ .wrap{padding:0 !important;} .hero{padding:20px 16px !important;} .inner{padding:4px 16px 0 !important;} }
</style></head><body>
<div class="wrap" style="padding:20px 10px;">
  <div style="max-width:620px;margin:0 auto;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(20,30,80,.08);">
    ${header(p)}
    ${c.hero}
    <div class="inner" style="padding:8px 24px 0;">
      <p style="margin:18px 0 12px;font-size:15px;color:${INK};">Dear ${e(seller.contactName)},</p>
      ${c.body.join('\n')}
      ${h2('Your proposal at a glance')}
      ${summaryTable(p, seller, cfg, t)}
      ${cta(p, seller, cfg)}
      ${para('<span style="font-size:13px;color:' + MUTED + ';">Open the proposal to review the full terms and confirm. For any changes, simply reply to this email or call me.</span>')}
      <p style="margin:18px 0 0;font-size:14px;color:${INK};">Warm regards,</p>
      ${signature(cfg)}
    </div>
    ${footer(p, cfg)}
  </div>
</div></body></html>`;
    return { scenario: sc, subject: c.subject, html };
  }

  return { build, resolveScenario };
})();

</script>
  <script>/* ---- js/engine/proposal-service.js ---- */
/* =====================================================================
 * PROPOSAL SERVICE – builds proposals from recommendations, applies
 * executive edits, simulates sending and keeps the tracking record.
 * Every function takes the state explicitly (no DOM), so the same code
 * drives the UI and the automated acceptance tests.
 * ===================================================================== */
window.UC = window.UC || {};

UC.ProposalService = (function () {
  const U = UC.Util, P = UC.PricingEngine;

  /* ---------------- state ---------------- */
  function newState() {
    return {
      version: 3,
      scenarioId: '1.1',
      screen: 'profile',
      history: [],
      workspaces: {},
      tracking: {},
      notifications: [],
      counters: { nextProposalId: null, refSeq: 1 },
      editing: null,
      viewingEmailId: null,
      lastSentId: null,
      filter: 'All'
    };
  }

  function workspace(state, scenarioId) {
    if (!state.workspaces[scenarioId]) {
      const sc = UC.DATA.SCENARIOS.find(s => s.id === scenarioId);
      state.workspaces[scenarioId] = {
        proposals: UC.DATA.existingProposals(sc.sellerKey).map(p => Object.assign(p, { scenarioId })),
        draftId: null,
        revealed: false
      };
    }
    return state.workspaces[scenarioId];
  }

  function nextProposalId(state, cfg) {
    if (!state.counters.nextProposalId) state.counters.nextProposalId = cfg.proposalIdStart;
    return String(state.counters.nextProposalId++);
  }

  function findProposal(state, scenarioId, id) {
    return workspace(state, scenarioId).proposals.find(p => p.id === id) || null;
  }

  /* ---------------- line builders ---------------- */
  function mcatLine(cfg, serviceKey, tenure, mc, source) {
    const mrp = P.lineMrp(cfg, serviceKey, tenure, mc.priceTier);
    return {
      kind: 'mcat', mcatId: mc.id, name: mc.name, rank: mc.rank, opted: mc.opted, tier: mc.priceTier,
      mrp, deal: mrp === null ? 0 : mrp,
      reason: mc.selectionReason || '', source: source || 'system'
    };
  }
  function serviceLine(cfg, serviceKey, tenure) {
    const mrp = P.lineMrp(cfg, serviceKey, tenure);
    return { kind: 'service', name: cfg.services[serviceKey].name, mrp, deal: mrp === null ? 0 : mrp, source: 'system' };
  }

  function blankFinal(cfg) {
    return {
      serviceKey: null, tenure: null, lines: [],
      partPayment: { on: false, advance: 0, inst1Days: 30 },
      tds: { on: false, pct: cfg.tdsDefaultPct },
      discount: { on: false, offerId: null, mode: 'pct', pct: 0, amt: 0 },
      validTill: U.isoDate(U.addDays(new Date(), cfg.defaultValidityDays)),
      mcatScenarioKey: null, mcatStatus: null
    };
  }

  /** Re-builds lines for a (possibly new) service, re-running MCAT selection. */
  function applyService(final, seller, cfg, serviceKey, tenure) {
    const svc = cfg.services[serviceKey];
    final.serviceKey = serviceKey;
    final.tenure = tenure && P.tenuresFor(cfg, serviceKey).includes(tenure) ? tenure : svc.defaultTenure;
    if (svc.mcatBased) {
      const res = UC.McatEngine.evaluate(seller, serviceKey, cfg);
      final.lines = res.selected.map(mc => mcatLine(cfg, serviceKey, final.tenure, mc, 'system'));
      final.mcatScenarioKey = res.scenarioKey;
      final.mcatStatus = res.status;
    } else {
      final.lines = [serviceLine(cfg, serviceKey, final.tenure)];
      final.mcatScenarioKey = null;
      final.mcatStatus = null;
    }
    return final;
  }

  function setTenure(final, cfg, tenure) {
    final.tenure = tenure;
    final.lines.forEach(l => {
      l.mrp = P.lineMrp(cfg, final.serviceKey, tenure, l.tier);
      l.deal = l.mrp === null ? 0 : l.mrp;
    });
    return final;
  }

  function addMcat(final, seller, cfg, mcatId) {
    if (final.lines.some(l => l.mcatId === mcatId)) return final;
    const res = UC.McatEngine.evaluate(seller, final.serviceKey, cfg);
    const mc = res.mcats.find(x => x.id === mcatId);
    if (!mc) return final;
    const source = mc.eligible ? 'executive' : 'executive-outside-criteria';
    const line = mcatLine(cfg, final.serviceKey, final.tenure, mc, source);
    line.reason = mc.eligible
      ? `Added by executive. ${mc.eligibilityText}.`
      : `Added by executive outside the recommendation criteria. ${mc.eligibilityText}.`;
    final.lines.push(line);
    return final;
  }
  function removeMcat(final, mcatId) {
    final.lines = final.lines.filter(l => l.mcatId !== mcatId);
    return final;
  }

  /* ---------------- generation ---------------- */
  function recommendationSnapshot(seller, rec, mcatRes) {
    return {
      journey: rec.journey, headline: rec.headline, ruleId: rec.ruleId, scenarioCode: rec.scenarioCode,
      serviceKey: rec.serviceKey, tenure: rec.tenure, reason: rec.reason,
      triggeredChecks: rec.triggered.map(c => c.id),
      mcats: mcatRes && mcatRes.applicable ? mcatRes.selected.map(x => ({ id: x.id, name: x.name, rank: x.rank, opted: x.opted })) : [],
      mcatStatus: mcatRes && mcatRes.applicable ? mcatRes.status : null,
      mcatScenarioKey: mcatRes && mcatRes.applicable ? mcatRes.scenarioKey : null,
      metrics: Object.assign({}, seller.metrics),
      currentService: Object.assign({}, seller.currentService)
    };
  }

  /** Called when the executive taps "+": shows (and if needed generates) the recommended proposal. */
  function revealRecommended(state, cfg, seller) {
    const ws = workspace(state, seller.scenarioId);
    ws.revealed = true;
    if (ws.draftId && findProposal(state, seller.scenarioId, ws.draftId)) return findProposal(state, seller.scenarioId, ws.draftId);
    const rec = UC.RecommendationEngine.evaluate(seller, cfg);
    if (!rec.proposalAllowed) return null;
    if (ws.proposals.some(p => p.origin === 'system' && p.status === 'Sent')) return null; // already sent
    const final = applyService(blankFinal(cfg), seller, cfg, rec.serviceKey, rec.tenure);
    const mcatRes = cfg.services[rec.serviceKey].mcatBased ? UC.McatEngine.evaluate(seller, rec.serviceKey, cfg) : null;
    const p = {
      id: nextProposalId(state, cfg), origin: 'system', scenarioId: seller.scenarioId, sellerGlid: seller.glid,
      status: 'Draft', createdAt: new Date().toISOString(),
      recommendation: recommendationSnapshot(seller, rec, mcatRes),
      final, refNo: null, sentAt: null, email: null
    };
    ws.proposals.unshift(p);
    ws.draftId = p.id;
    track(state, cfg, seller, p);
    return p;
  }

  function createManualDraft(state, cfg, seller) {
    const ws = workspace(state, seller.scenarioId);
    const rec = UC.RecommendationEngine.evaluate(seller, cfg);
    const p = {
      id: nextProposalId(state, cfg), origin: 'manual', scenarioId: seller.scenarioId, sellerGlid: seller.glid,
      status: 'Draft', createdAt: new Date().toISOString(),
      recommendation: recommendationSnapshot(seller, rec, null),
      final: blankFinal(cfg), refNo: null, sentAt: null, email: null
    };
    ws.proposals.unshift(p);
    ws.draftId = p.id;
    ws.revealed = true;
    track(state, cfg, seller, p);
    return p;
  }

  function saveFinal(state, cfg, seller, proposalId, final) {
    const p = findProposal(state, seller.scenarioId, proposalId);
    if (!p) throw new Error('Proposal not found');
    p.final = U.clone(final);
    p.updatedAt = new Date().toISOString();
    if (p.origin !== 'existing') track(state, cfg, seller, p);
    return p;
  }

  function validate(cfg, final) {
    const errors = [];
    if (!final.serviceKey) errors.push('Select a service.');
    else {
      if (cfg.services[final.serviceKey].mcatBased && final.lines.length === 0) errors.push('Add at least one MCAT – the MCAT recommendation is on hold.');
      if (final.lines.some(l => l.mrp === null)) errors.push(`Price not configured for ${final.tenure} on one or more MCAT tiers. Change tenure or update the price configuration.`);
      if (final.lines.some(l => !(Number(l.deal) > 0))) errors.push('Deal Value must be greater than zero.');
    }
    if (!final.validTill) errors.push('Valid Till is required.');
    return errors;
  }

  /* ---------------- sending (simulated) ---------------- */
  function makeRefNo(state, seller) {
    const used = new Set(Object.values(state.tracking).map(t => t.proposalRefNo).filter(Boolean));
    let ref;
    do {
      const d = new Date();
      const stamp = `${String(d.getFullYear()).slice(2)}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
      const rnd = Math.random().toString(36).slice(2, 5).toUpperCase();
      ref = `UCP-${stamp}-${seller.glid.slice(-4)}-${String(state.counters.refSeq++).padStart(4, '0')}${rnd}`;
    } while (used.has(ref));
    return ref;
  }

  function sendProposal(state, cfg, seller, proposalId) {
    const p = findProposal(state, seller.scenarioId, proposalId);
    if (!p) throw new Error('Proposal not found');
    const errors = validate(cfg, p.final);
    if (errors.length) return { ok: false, errors };
    p.refNo = makeRefNo(state, seller);
    p.sentAt = new Date().toISOString();
    p.status = 'Sent';
    const email = UC.EmailTemplates.build(p, seller, cfg);
    p.email = { subject: email.subject, html: email.html, scenario: email.scenario, recipient: cfg.recipientEmail, sentAt: p.sentAt };
    const ws = workspace(state, seller.scenarioId);
    if (ws.draftId === p.id) ws.draftId = null;
    track(state, cfg, seller, p);
    state.notifications.unshift({
      id: 'n' + Date.now(), at: p.sentAt, read: false,
      text: `Proposal ${p.id} (${cfg.services[p.final.serviceKey].name} – ${p.final.tenure}) sent to ${cfg.recipientEmail}. Ref ${p.refNo}`
    });
    state.lastSentId = p.id;
    return { ok: true, proposal: p };
  }

  /* ---------------- tracking ---------------- */
  function track(state, cfg, seller, p) {
    const t = P.totals(cfg, p.final);
    const r = p.recommendation || {};
    const finalMcats = p.final.lines.filter(l => l.kind === 'mcat').map(l => l.name);
    const recMcats = (r.mcats || []).map(m => m.name);
    state.tracking[p.id] = {
      proposalId: p.id,
      origin: p.origin,
      scenarioId: p.scenarioId,
      sellerGlid: seller.glid,
      sellerName: seller.name,
      currentService: `${seller.currentService.serviceKey} ${seller.currentService.tenure}`,
      journey: r.journey || null,
      ruleId: r.ruleId || null,
      scenarioCode: r.scenarioCode || null,
      originalRecommendedService: r.serviceKey ? `${r.serviceKey} ${r.tenure}` : null,
      finalSelectedService: p.final.serviceKey ? `${p.final.serviceKey} ${p.final.tenure}` : null,
      serviceOverridden: !!(r.serviceKey && p.final.serviceKey && r.serviceKey !== p.final.serviceKey),
      tenureChanged: !!(r.tenure && p.final.tenure && r.tenure !== p.final.tenure && r.serviceKey === p.final.serviceKey),
      recommendationReason: r.reason || null,
      blDau: seller.metrics.blDau,
      pnsSuccess: seller.metrics.pnsSuccess,
      totalARank: seller.metrics.totalARank,
      optedARankMcats: seller.metrics.optedARank,
      preferredDistricts: seller.metrics.preferredDistricts,
      recommendedMcats: recMcats,
      selectedMcats: finalMcats,
      mcatsChanged: recMcats.slice().sort().join('|') !== finalMcats.slice().sort().join('|'),
      mcatStatus: r.mcatStatus || null,
      mrp: t.mrpTotal,
      dealValue: t.dealTotal,
      discount: t.discountAmt,
      netDealValue: t.netDeal,
      amountInclGst: t.amountInclGst,
      subscriptionTenure: p.final.tenure,
      proposalRefNo: p.refNo,
      proposalCreatedAt: p.createdAt,
      emailStatus: p.status === 'Sent' ? 'Sent' : 'Not sent',
      emailScenario: p.email ? p.email.scenario : null,
      sentAt: p.sentAt,
      approvalStatus: null   // to be filled when MERP approval / rejection is integrated
    };
  }

  return {
    newState, workspace, findProposal, revealRecommended, createManualDraft,
    applyService, setTenure, addMcat, removeMcat, saveFinal, validate, sendProposal, blankFinal
  };
})();
